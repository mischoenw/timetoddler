name: firmware

on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol and button tests (no ESP-IDF)
        run: |
          cmake -S firmware/test_host -B build-host
          cmake --build build-host
          ./build-host/tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF v6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware
          command: idf.py build && idf.py merge-bin -o timetoddler-knob.bin
      - uses: actions/upload-artifact@v4
        with:
          name: timetoddler-knob
          path: |
            firmware/build/timetoddler-knob.bin
            firmware/build/timetoddler_knob.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
            firmware/dependencies.lock
          if-no-files-found: error
